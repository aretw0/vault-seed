packages:
  - "."
  - "packages/*"
allowBuilds:
  esbuild: false
  sharp: false
# Supply-chain policy: downgrade from error to warn so that recently-published
# packages (e.g. Astro ecosystem updates) don't block template users' CI.
# The template maintainer curates all packages; pnpm v11 defaults are too
# strict for a curated template repo where new dependencies are expected.
#
# `@refarm.dev/*` is excluded outright: these are curated local tarballs
# (file:vendor/*.tgz) consumed before refarm publishes to npm, so the registry
# release-age check cannot resolve them (404) and would block a clean install.
policies:
  minimumReleaseAge:
    severity: warn
minimumReleaseAgeExclude:
  - "@refarm.dev/*"
# Refs @refarm.dev/* não-publicadas redirecionadas para os tarballs locais até o
# refarm publicar. file: é relativo a esta raiz. O conjunto é exatamente o de
# vendor/manifest.json (refs diretas + transitivas do packet consumido); pacotes
# que nada aqui consome não entram, mesmo estando no packet.
overrides:
  "@refarm.dev/artifact-contract-v1": "file:vendor/refarm.dev-artifact-contract-v1-0.1.0.tgz"
  "@refarm.dev/channel-policy-v1": "file:vendor/refarm.dev-channel-policy-v1-0.1.0.tgz"
  "@refarm.dev/content-projection": "file:vendor/refarm.dev-content-projection-0.1.0.tgz"
  "@refarm.dev/credentials-contract-v1": "file:vendor/refarm.dev-credentials-contract-v1-0.1.0.tgz"
  "@refarm.dev/ds": "file:vendor/refarm.dev-ds-0.1.0.tgz"
  "@refarm.dev/ds-astro": "file:vendor/refarm.dev-ds-astro-0.1.0.tgz"
  "@refarm.dev/enrichment-contract-v1": "file:vendor/refarm.dev-enrichment-contract-v1-0.1.0.tgz"
  "@refarm.dev/heartwood": "file:vendor/refarm.dev-heartwood-0.1.0.tgz"
  "@refarm.dev/identity-contract-v1": "file:vendor/refarm.dev-identity-contract-v1-0.1.0.tgz"
  "@refarm.dev/identity-heartwood": "file:vendor/refarm.dev-identity-heartwood-0.1.0.tgz"
  "@refarm.dev/local-surface": "file:vendor/refarm.dev-local-surface-0.1.0.tgz"
  "@refarm.dev/process-handoff": "file:vendor/refarm.dev-process-handoff-0.1.0.tgz"
  "@refarm.dev/quality-contract-v1": "file:vendor/refarm.dev-quality-contract-v1-0.1.0.tgz"
  "@refarm.dev/records-contract-v1": "file:vendor/refarm.dev-records-contract-v1-0.1.0.tgz"
  "@refarm.dev/silo": "file:vendor/refarm.dev-silo-0.1.0.tgz"
  "@refarm.dev/source-contract-v1": "file:vendor/refarm.dev-source-contract-v1-0.1.0.tgz"
  "@refarm.dev/source-web": "file:vendor/refarm.dev-source-web-0.1.0.tgz"
  "@refarm.dev/storage-contract-v1": "file:vendor/refarm.dev-storage-contract-v1-0.1.0.tgz"
  "@refarm.dev/storage-memory": "file:vendor/refarm.dev-storage-memory-0.1.0.tgz"
