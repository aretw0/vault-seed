name: Refresh Lab Data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4.0.0
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v6.3.1
        with:
          version: "0.11.11"

      - name: Run ETL
        run: pnpm run notebooks:etl

      - name: Run AI feed curation
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: uv run --with anthropic --with defusedxml python scripts/curate_feeds_ia.py
        continue-on-error: true

      # .dgk/ é ignorado pelo git — snapshots são efêmeros e regenerados pelo CI a cada deploy.
      # Este workflow serve para acionar o ETL + curadoria IA manualmente ou via schedule,
      # mas não persiste nenhum arquivo no repositório.
