name: Publish Packages

# Triggered by any @aretw0 package tag. Publishes the entire workspace via
# `pnpm changeset publish` — idempotent: already-published versions are skipped.
# Uses npm provenance attestation consistent with the per-package workflows
# generated by `dgk publish`.

on:
  push:
    tags:
      - '@aretw0/dgk-cli@*'
      - '@aretw0/dgk-channels@*'
      - '@aretw0/dgk-astro-plugins@*'
      - '@aretw0/dgk-skills@*'
      - '@aretw0/dgk-runner@*'

permissions:
  contents: read
  id-token: write  # required for npm provenance attestation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @aretw0 workspace to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js with npm auth
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache-mode: "off"

      - name: Preflight — verify NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Build publishable packages
        run: pnpm --filter @aretw0/dgk-astro-plugins build

      - name: Publish
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ vars.NPM_CONFIG_PROVENANCE }}
